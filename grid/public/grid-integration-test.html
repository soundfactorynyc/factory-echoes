<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Integration Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: sans-serif;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-2xl font-bold mb-4">Grid Integration Test</h1>
    
    <div id="app-root"></div>
  </div>

  <script type="module">
    // Import the necessary modules
    import React from 'react';
    import ReactDOM from 'react-dom';
    import App from '../src/App.js';
    import { gridOS } from '../src/integration/gridOSBackend.js';
    import { performanceMonitor } from '../src/integration/performanceMonitor.js';

    // Initialize the grid system
    window.gridOS = gridOS;
    window.performanceMonitor = performanceMonitor;
    
    // Start performance monitoring
    performanceMonitor.startMonitoring();
    
    // Add performance display to the page
    const perfDisplay = document.createElement('div');
    perfDisplay.className = 'fixed top-4 right-4 bg-gray-900 bg-opacity-90 text-white rounded-lg shadow-lg p-2 text-xs';
    perfDisplay.innerHTML = 'FPS: 60';
    document.body.appendChild(perfDisplay);
    
    // Update performance display
    performanceMonitor.onFpsUpdate(fps => {
      perfDisplay.innerHTML = `FPS: ${Math.round(fps)}`;
    });
    
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', () => {
      // Render the App component
      ReactDOM.render(
        React.createElement(App),
        document.getElementById('app-root')
      );
      
      // Send some initial grid commands to demonstrate functionality
      setTimeout(() => {
        console.log('Activating initial grid pattern...');
        
        // Create a border pattern
        const borderPattern = [];
        for (let i = 0; i < 64; i++) {
          const row = Math.floor(i / 8);
          const col = i % 8;
          
          if (row === 0 || row === 7 || col === 0 || col === 7) {
            borderPattern.push(i.toString());
          }
        }
        
        gridOS.eventBus.sendGridCommand('activate', borderPattern);
        
        // Pulse the tiles
        setTimeout(() => {
          gridOS.eventBus.sendGridCommand('pulse', undefined, 0.8);
        }, 1000);
        
        // Send a beat event
        setTimeout(() => {
          gridOS.eventBus.sendBeatEvent(120, 0.9, true, 4, 0);
        }, 2000);
      }, 3000);
    });
  </script>
</body>
</html>
