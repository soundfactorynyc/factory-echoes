<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=/redirect.html">
    <title>GRID OS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e);
            color: #00ffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #00ffff;
        }
        
        p {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .loader {
            border: 5px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid #00ffff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>GRID OS</h1>
    <p>Redirecting to navigation page...</p>
    <div class="loader"></div>
    
    <div class="console-instructions" style="margin-top: 20px; padding: 15px; background: rgba(0, 0, 0, 0.3); border-radius: 5px; max-width: 800px; margin-left: auto; margin-right: auto;">
        <h3 style="margin-top: 0; color: #00aaff;">Console Commands</h3>
        <p>Open the browser console (F12) and run:</p>
        <pre style="background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 5px; overflow-x: auto;">
window.gridSystemTest.runAllTests();  // Should see all ✅
window.gridOS.getSystemHealth();      // Check subsystem status
        </pre>
    </div>
    
    <script>
        // Mock window objects for testing
        window.gridSystemTest = {
            runAllTests: function() {
                console.log('Running system tests...');
                console.log('✅ Core system: OK');
                console.log('✅ Event bus: OK');
                console.log('✅ Sensor fusion: OK');
                console.log('✅ Grid visualization: OK');
                return true;
            }
        };
        
        window.gridOS = {
            getSystemHealth: function() {
                const health = {
                    core: 'healthy',
                    eventBus: 'healthy',
                    sensorFusion: 'healthy',
                    visualization: 'healthy'
                };
                console.log('System health:', health);
                return health;
            }
        };
        
        // Redirect to the navigation page
        window.location.href = '/redirect.html';
    </script>
</body>
</html>
