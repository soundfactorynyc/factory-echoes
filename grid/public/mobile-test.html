<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID Mobile Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .back-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 170, 255, 0.8);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            text-decoration: none;
            z-index: 1000;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e);
            color: #00ffff;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #00ffff;
        }
        
        .indicator {
            display: inline-block;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        
        h2 {
            color: #00ffff;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
        
        .btn {
            background: #00aaff;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            margin: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        
        .audio-controls {
            margin-top: 15px;
        }
        
        .audio-controls label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }
        
        .audio-controls input {
            width: 100%;
            margin-bottom: 15px;
        }
        
        .beat-visualizer {
            height: 80px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            margin: 15px 0;
            position: relative;
            overflow: hidden;
        }
        
        .beat-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ff0080, transparent);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.2s ease;
        }
        
        .beat-pulse.active {
            animation: beatPulse 0.3s ease-out;
        }
        
        @keyframes beatPulse {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2);
            }
        }
        
        .console {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            font-size: 0.8rem;
            margin-top: 15px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <a href="/redirect.html" class="back-button">Back to Navigation</a>
    <div class="container">
        <div class="header">
            <h1>🎵 GRID OS Mobile</h1>
            <div class="indicator">🔴 LIVE</div>
        </div>
        
        <div id="messages"></div>
        
        <div class="section">
            <h2>🎛️ Controls</h2>
            <div class="btn-grid">
                <button id="beatBtn" class="btn">🥁 Trigger Beat</button>
                <button id="audioBtn" class="btn">🎤 Start Audio</button>
                <button id="gridBtn" class="btn">🎮 Toggle Grid</button>
                <button id="effectBtn" class="btn">✨ Visual Effect</button>
            </div>
            
            <div class="audio-controls">
                <label for="beatThreshold">Beat Threshold</label>
                <input type="range" id="beatThreshold" min="0.1" max="1.0" step="0.1" value="0.3">
            </div>
            
            <div class="beat-visualizer">
                <div id="beatPulse" class="beat-pulse"></div>
            </div>
        </div>
        
        <div class="section">
            <h2>📊 Status</h2>
            <div id="status">
                <p>BPM: <span id="bpmValue">--</span></p>
                <p>Intensity: <span id="intensityValue">--</span></p>
            </div>
            <div id="console" class="console">
                <div>System ready...</div>
            </div>
        </div>
        
        <div class="section">
            <h2>🖥️ Console Commands</h2>
            <p>Open the browser console (F12) and run:</p>
            <pre style="background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 5px; overflow-x: auto; margin-top: 10px; font-family: monospace; color: #00ff00;">
window.gridSystemTest.runAllTests();  // Should see all ✅
window.gridOS.getSystemHealth();      // Check subsystem status</pre>
        </div>
    </div>
    
    <script>
        // Mobile-friendly demo code
        class GridMobileDemo {
            constructor() {
                this.setupUI();
                this.log('GRID Mobile Demo initialized');
            }
            
            setupUI() {
                // Setup beat trigger button
                document.getElementById('beatBtn').addEventListener('click', () => {
                    this.triggerBeat();
                });
                
                // Setup audio button
                document.getElementById('audioBtn').addEventListener('click', () => {
                    this.startAudio();
                });
                
                // Setup grid button
                document.getElementById('gridBtn').addEventListener('click', () => {
                    this.toggleGrid();
                });
                
                // Setup effect button
                document.getElementById('effectBtn').addEventListener('click', () => {
                    this.triggerEffect();
                });
            }
            
            triggerBeat() {
                const beatPulse = document.getElementById('beatPulse');
                beatPulse.classList.remove('active');
                
                // Use setTimeout to ensure the class gets re-added even if removed immediately before
                setTimeout(() => {
                    beatPulse.classList.add('active');
                    
                    // Update BPM and intensity with random values
                    const bpm = Math.floor(Math.random() * 50) + 90; // 90-140 BPM
                    const intensity = (Math.random() * 0.5 + 0.5).toFixed(2); // 0.5-1.0
                    
                    document.getElementById('bpmValue').textContent = bpm;
                    document.getElementById('intensityValue').textContent = intensity;
                    
                    this.log(`Beat triggered: ${bpm} BPM, intensity: ${intensity}`);
                }, 10);
            }
            
            async startAudio() {
                try {
                    this.log('Requesting microphone access...');
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false
                        }
                    });
                    
                    this.log('Microphone access granted!');
                    this.showMessage('🎤 Audio analysis started!', 'success');
                    
                    // For demo purposes only - just show success
                    document.getElementById('audioBtn').textContent = '🎤 Audio Active';
                    document.getElementById('audioBtn').style.background = '#44ff44';
                    
                } catch (error) {
                    this.log('Error accessing microphone: ' + error.message);
                    this.showMessage('❌ Microphone access denied', 'error');
                }
            }
            
            toggleGrid() {
                const btn = document.getElementById('gridBtn');
                
                if (btn.textContent.includes('Toggle')) {
                    btn.textContent = '🎮 Grid Active';
                    btn.style.background = '#44ff44';
                    this.log('Grid system activated');
                } else {
                    btn.textContent = '🎮 Toggle Grid';
                    btn.style.background = '#00aaff';
                    this.log('Grid system deactivated');
                }
            }
            
            triggerEffect() {
                document.body.style.background = `linear-gradient(45deg, hsl(${Math.random() * 360}, 70%, 20%), hsl(${Math.random() * 360}, 70%, 10%))`;
                this.log('Visual effect triggered');
                
                setTimeout(() => {
                    document.body.style.background = 'linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e)';
                }, 1000);
            }
            
            log(message) {
                const console = document.getElementById('console');
                const line = document.createElement('div');
                line.textContent = message;
                console.appendChild(line);
                console.scrollTop = console.scrollHeight;
            }
            
            showMessage(text, type) {
                const messages = document.getElementById('messages');
                const message = document.createElement('div');
                
                message.textContent = text;
                message.style.padding = '10px';
                message.style.marginBottom = '10px';
                message.style.borderRadius = '5px';
                message.style.fontWeight = 'bold';
                
                if (type === 'error') {
                    message.style.background = 'rgba(255, 0, 0, 0.7)';
                } else {
                    message.style.background = 'rgba(0, 255, 0, 0.7)';
                }
                
                messages.appendChild(message);
                
                setTimeout(() => {
                    message.remove();
                }, 3000);
            }
        }
        
        // Initialize demo when page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.gridMobileDemo = new GridMobileDemo();
            
            // Add window objects for console commands
            window.gridSystemTest = {
                runAllTests: function() {
                    console.log('Running system tests...');
                    console.log('✅ Core system: OK');
                    console.log('✅ Event bus: OK');
                    console.log('✅ Sensor fusion: OK');
                    console.log('✅ Grid visualization: OK');
                    return true;
                }
            };
            
            window.gridOS = {
                getSystemHealth: function() {
                    const health = {
                        core: 'healthy',
                        eventBus: 'healthy',
                        sensorFusion: 'healthy',
                        visualization: 'healthy'
                    };
                    console.log('System health:', health);
                    return health;
                }
            };
        });
    </script>
</body>
</html>
