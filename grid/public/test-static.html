<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRID OS System Test</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #111;
      color: #eee;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    header {
      background-color: #222;
      padding: 1rem;
      border-bottom: 1px solid #333;
    }
    
    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #00ffff;
    }
    
    main {
      flex: 1;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .test-section {
      background-color: #222;
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid #333;
    }
    
    .test-section h2 {
      margin-top: 0;
      color: #00ffff;
      font-size: 1.2rem;
    }
    
    .test-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    button {
      background-color: #333;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }
    
    button:hover {
      background-color: #444;
    }
    
    button.primary {
      background-color: #0066cc;
      border-color: #0077dd;
    }
    
    button.primary:hover {
      background-color: #0077dd;
    }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-top: 1rem;
    }
    
    .grid-tile {
      aspect-ratio: 1;
      background-color: #333;
      border-radius: 4px;
      transition: all 0.3s ease;
    }
    
    .grid-tile.active {
      background-color: #00ffff;
      box-shadow: 0 0 10px #00ffff, 0 0 20px rgba(0, 255, 255, 0.5);
    }
    
    .console {
      background-color: #000;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 0.5rem;
      font-family: monospace;
      height: 200px;
      overflow-y: auto;
      margin-top: 1rem;
    }
    
    .console-line {
      margin: 0;
      padding: 2px 0;
      border-bottom: 1px solid #222;
    }
    
    .console-line.info {
      color: #aaa;
    }
    
    .console-line.success {
      color: #00aa00;
    }
    
    .console-line.warning {
      color: #aaaa00;
    }
    
    .console-line.error {
      color: #aa0000;
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    
    .status-badge {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #333;
    }
    
    .status-badge.healthy {
      background-color: #00aa00;
      box-shadow: 0 0 5px #00aa00;
    }
    
    .status-badge.degraded {
      background-color: #aaaa00;
      box-shadow: 0 0 5px #aaaa00;
    }
    
    .status-badge.critical {
      background-color: #aa0000;
      box-shadow: 0 0 5px #aa0000;
    }
    
    footer {
      background-color: #222;
      padding: 1rem;
      border-top: 1px solid #333;
      text-align: center;
      font-size: 0.8rem;
    }
    
    #test-results {
      margin-top: 1rem;
    }
    
    #test-results table {
      width: 100%;
      border-collapse: collapse;
    }
    
    #test-results th, #test-results td {
      padding: 0.5rem;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    
    #test-results th {
      background-color: #222;
    }
  </style>
</head>
<body>
  <header>
    <h1>GRID OS System Test</h1>
  </header>
  
  <main>
    <div class="test-section">
      <h2>System Health</h2>
      <div class="test-controls">
        <button id="check-health">Check System Health</button>
        <button id="run-tests" class="primary">Run All Tests</button>
      </div>
      
      <div class="status-indicator">
        <div id="status-badge" class="status-badge"></div>
        <span id="status-text">System status: Unknown</span>
      </div>
      
      <div id="test-results"></div>
    </div>
    
    <div class="test-section">
      <h2>Grid Visualization</h2>
      <div class="test-controls">
        <button id="activate-tile">Activate Random Tile</button>
        <button id="pulse-grid">Pulse Grid</button>
        <button id="cascade-grid">Cascade Effect</button>
        <button id="reset-grid">Reset Grid</button>
      </div>
      
      <div id="grid-container" class="grid-container">
        <!-- Grid tiles will be generated here -->
      </div>
    </div>
    
    <div class="test-section">
      <h2>Event Simulation</h2>
      <div class="test-controls">
        <button id="send-chat">Send Chat Message</button>
        <button id="send-beat">Send Beat Event</button>
        <button id="send-money">Send Money Shot</button>
        <button id="send-emoji">Send Emoji</button>
      </div>
      
      <div class="console" id="console">
        <!-- Console output will be displayed here -->
      </div>
    </div>
  </main>
  
  <footer>
    GRID OS v1.0.0 &copy; 2025 Anthropic
  </footer>
  
  <script>
    // Wait for GRID OS to be loaded
    window.addEventListener('load', () => {
      setTimeout(() => {
        initializeTestPage();
      }, 1000);
    });
    
    function initializeTestPage() {
      // Generate grid tiles
      const gridContainer = document.getElementById('grid-container');
      for (let i = 0; i < 64; i++) {
        const tile = document.createElement('div');
        tile.className = 'grid-tile';
        tile.dataset.id = i;
        gridContainer.appendChild(tile);
      }
      
      // Set up button event listeners
      document.getElementById('check-health').addEventListener('click', checkSystemHealth);
      document.getElementById('run-tests').addEventListener('click', runAllTests);
      document.getElementById('activate-tile').addEventListener('click', activateRandomTile);
      document.getElementById('pulse-grid').addEventListener('click', pulseGrid);
      document.getElementById('cascade-grid').addEventListener('click', cascadeGrid);
      document.getElementById('reset-grid').addEventListener('click', resetGrid);
      document.getElementById('send-chat').addEventListener('click', sendChatMessage);
      document.getElementById('send-beat').addEventListener('click', sendBeatEvent);
      document.getElementById('send-money').addEventListener('click', sendMoneyShot);
      document.getElementById('send-emoji').addEventListener('click', sendEmoji);
      
      // Log initialization
      logToConsole('GRID OS Test Page initialized', 'info');
      
      // Initial health check
      checkSystemHealth();
    }
    
    function checkSystemHealth() {
      if (window.gridOS && window.gridOS.getSystemHealth) {
        const health = window.gridOS.getSystemHealth();
        updateStatusIndicator(health.status);
        logToConsole(`System health: ${health.status}`, health.status === 'healthy' ? 'success' : health.status === 'degraded' ? 'warning' : 'error');
        
        // Log subsystem health
        for (const [name, subsystem] of Object.entries(health.subsystems)) {
          logToConsole(`- ${name}: ${subsystem.status}`, subsystem.status === 'healthy' ? 'success' : subsystem.status === 'degraded' ? 'warning' : 'error');
        }
        
        // Log diagnostics
        if (health.diagnostics.length > 0) {
          health.diagnostics.forEach(diagnostic => {
            logToConsole(diagnostic, diagnostic.includes('CRITICAL') ? 'error' : 'warning');
          });
        }
      } else {
        updateStatusIndicator('unknown');
        logToConsole('GRID OS not available', 'error');
      }
    }
    
    function runAllTests() {
      if (window.gridSystemTest && window.gridSystemTest.runAllTests) {
        logToConsole('Running all system tests...', 'info');
        window.gridSystemTest.runAllTests()
          .then(() => {
            logToConsole('All tests completed', 'success');
            checkSystemHealth();
          })
          .catch(error => {
            logToConsole(`Test error: ${error}`, 'error');
          });
      } else {
        logToConsole('Test system not available', 'error');
      }
    }
    
    function activateRandomTile() {
      const tileId = Math.floor(Math.random() * 64).toString();
      if (window.gridOS && window.gridOS.eventBus) {
        window.gridOS.eventBus.sendGridCommand('activate', [tileId], 1.0);
        logToConsole(`Activated tile ${tileId}`, 'info');
        updateTileVisuals([parseInt(tileId)], true);
      } else {
        logToConsole('GRID OS not available', 'error');
      }
    }
    
    function pulseGrid() {
      if (window.gridOS && window.gridOS.eventBus) {
        const tileIds = Array.from({ length: 16 }, () => Math.floor(Math.random() * 64).toString());
        window.gridOS.eventBus.sendGridCommand('pulse', tileIds, 0.8, 1000, 'radial');
        logToConsole(`Pulsing ${tileIds.length} tiles`, 'info');
        updateTileVisuals(tileIds.map(id => parseInt(id)), true);
        
        // Simulate pulse animation
        setTimeout(() => {
          updateTileVisuals(tileIds.map(id => parseInt(id)), false);
        }, 1000);
      } else {
        logToConsole('GRID OS not available', 'error');
      }
    }
    
    function cascadeGrid() {
      if (window.gridOS && window.gridOS.eventBus) {
        const allTileIds = Array.from({ length: 64 }, (_, i) => i.toString());
        window.gridOS.eventBus.sendGridCommand('cascade', allTileIds, 1.0, 2000, 'spiral');
        logToConsole('Cascading all tiles', 'info');
        
        // Simulate cascade animation
        for (let i = 0; i < 64; i++) {
          setTimeout(() => {
            updateTileVisuals([i], true);
          }, i * 30);
          
          setTimeout(() => {
            updateTileVisuals([i], false);
          }, 2000 + i * 30);
        }
      } else {
        logToConsole('GRID OS not available', 'error');
      }
    }
    
    function resetGrid() {
      if (window.gridOS && window.gridOS.eventBus) {
        const allTileIds = Array.from({ length: 64 }, (_, i) => i.toString());
        window.gridOS.eventBus.sendGridCommand('deactivate', allTileIds);
        logToConsole('Reset all tiles', 'info');
        updateTileVisuals(Array.from({ length: 64 }, (_, i) => i), false);
      } else {
        logToConsole('GRID OS not available', 'error');
      }
    }
    
    function sendChatMessage() {
      if (window.gridOS && window.gridOS.eventBus) {
        const messages = [
          'Hello, world!',
          'Testing the GRID OS',
          'This is a chat message',
          'How does this look?',
          'GRID OS is amazing!'
        ];
        const randomMessage = messages[Math.floor(Math.random() * messages.length)];
        window.gridOS.eventBus.sendChatMessage('test-user', randomMessage, 'text');
        logToConsole(`Chat: ${randomMessage}`, 'info');
      } else {
        logToConsole('GRID OS not available', 'error');
      }
    }
    
    function sendBeatEvent() {
      if (window.gridOS && window.gridOS.eventBus) {
        const bpm = Math.floor(Math.random() * 60) + 90; // 90-150 BPM
        const intensity = Math.random() * 0.5 + 0.5; // 0.5-1.0 intensity
        window.gridOS.eventBus.sendBeatEvent(bpm, intensity, true, 4, 0);
        logToConsole(`Beat: ${bpm} BPM, ${intensity.toFixed(2)} intensity`, 'info');
        
        // Simulate beat visual
        const randomTiles = Array.from({ length: 8 }, () => Math.floor(Math.random() * 64));
        updateTileVisuals(randomTiles, true);
        setTimeout(() => {
          updateTileVisuals(randomTiles, false);
        }, 200);
      } else {
        logToConsole('GRID OS not available', 'error');
      }
    }
    
    function sendMoneyShot() {
      if (window.gridOS && window.gridOS.eventBus) {
        const amounts = [5, 10, 20, 50, 100];
        const amount = amounts[Math.floor(Math.random() * amounts.length)];
        const tiers = ['free', 'premium', 'vip', 'whale'];
        const tier = tiers[Math.min(Math.floor(amount / 20), 3)];
        window.gridOS.eventBus.sendMoneyShot('test-user', amount, tier, 'euphoric');
        logToConsole(`Money Shot: $${amount} (${tier})`, 'success');
        
        // Simulate money shot visual
        const tileCount = Math.min(Math.floor(amount / 5), 64);
        const randomTiles = Array.from({ length: tileCount }, () => Math.floor(Math.random() * 64));
        updateTileVisuals(randomTiles, true);
        setTimeout(() => {
          updateTileVisuals(randomTiles, false);
        }, 1000);
      } else {
        logToConsole('GRID OS not available', 'error');
      }
    }
    
    function sendEmoji() {
      if (window.gridOS && window.gridOS.eventBus) {
        const emojis = ['😀', '😍', '🔥', '💯', '🎉', '👍', '❤️', '🚀'];
        const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
        window.gridOS.eventBus.sendChatMessage('test-user', randomEmoji, 'emoji');
        logToConsole(`Emoji: ${randomEmoji}`, 'info');
        
        // Simulate emoji visual
        const randomTiles = Array.from({ length: 4 }, () => Math.floor(Math.random() * 64));
        updateTileVisuals(randomTiles, true);
        setTimeout(() => {
          updateTileVisuals(randomTiles, false);
        }, 500);
      } else {
        logToConsole('GRID OS not available', 'error');
      }
    }
    
    function updateStatusIndicator(status) {
      const statusBadge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      
      statusBadge.className = 'status-badge';
      if (status === 'healthy') {
        statusBadge.classList.add('healthy');
      } else if (status === 'degraded') {
        statusBadge.classList.add('degraded');
      } else if (status === 'critical') {
        statusBadge.classList.add('critical');
      }
      
      statusText.textContent = `System status: ${status.charAt(0).toUpperCase() + status.slice(1)}`;
    }
    
    function updateTileVisuals(tileIds, active) {
      const tiles = document.querySelectorAll('.grid-tile');
      
      if (active) {
        tileIds.forEach(id => {
          if (id >= 0 && id < tiles.length) {
            tiles[id].classList.add('active');
          }
        });
      } else {
        tileIds.forEach(id => {
          if (id >= 0 && id < tiles.length) {
            tiles[id].classList.remove('active');
          }
        });
      }
    }
    
    function logToConsole(message, type = 'info') {
      const consoleElement = document.getElementById('console');
      const line = document.createElement('p');
      line.className = `console-line ${type}`;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      consoleElement.appendChild(line);
      consoleElement.scrollTop = consoleElement.scrollHeight;
    }
  </script>
</body>
</html>
