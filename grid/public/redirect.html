<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID OS Navigation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e);
            color: #00ffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #00ffff;
        }
        
        p {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .loader {
            border: 5px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid #00ffff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .button-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .button {
            background: rgba(0, 170, 255, 0.8);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            min-width: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>GRID OS Navigation</h1>
    <p>Select a page to navigate to:</p>
    <div class="loader" style="display: none;"></div>
    
    <div class="button-container">
        <a href="/main.html" class="button">Go to Main GRID OS</a>
        <a href="/mobile-test.html" class="button">Go to Mobile Test</a>
        <a href="/grid-visual-test.html" class="button">Go to Grid Visual Test</a>
        <a href="/audio-analyzer-test.html" class="button">Go to Audio Analyzer</a>
        <a href="/iphone-instructions.html" class="button">iPhone Instructions</a>
        <a href="/redirect.html" class="button">This Navigation Page</a>
    </div>
    
    <script>
        // Disabled automatic redirect to allow navigation
        // Uncomment the code below to enable automatic redirect
        /*
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);
        */
    </script>
</body>
</html>
