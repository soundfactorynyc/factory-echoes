<!DOCTYPE html>
<html>
<head>
    <title>Test Reactions</title>
</head>
<body>
    <h1>Testing Reactions Component</h1>
    <div class="reactions-container">
        <canvas id="reaction-canvas" class="reaction-canvas"></canvas>
        <canvas id="effects-canvas" class="effects-canvas"></canvas>
        <div class="reactions-bar">
            <div class="reactions-row">
                <button class="reaction-btn" data-emoji="❤️" data-type="love">❤️</button>
                <button class="reaction-btn" data-emoji="🔥" data-type="fire">🔥</button>
                <button class="reaction-btn" data-emoji="😂" data-type="laugh">😂</button>
            </div>
        </div>
    </div>
</body>
</html>
