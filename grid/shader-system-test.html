<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid OS Shader System Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            margin: 0;
        }
        .test-panel {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .status-healthy { color: #00ff00; }
        .status-warning { color: #ffaa00; }
        .status-critical { color: #ff0000; }
        .status-pending { color: #00aaff; }
        .log-output {
            background: #000;
            color: #ccc;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-size: 12px;
            white-space: pre-wrap;
            border: 1px solid #333;
        }
        button {
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
            border-radius: 4px;
        }
        button:hover {
            background: #555;
        }
        .result-item {
            margin: 5px 0;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid;
        }
        .result-pass { border-left-color: #00ff00; }
        .result-fail { border-left-color: #ff0000; }
        .result-pending { border-left-color: #00aaff; }
    </style>
</head>
<body>
    <h1>🎨 Grid OS Shader System Test</h1>
    
    <div class="test-panel">
        <h2>System Status Check</h2>
        <button onclick="checkSystemStatus()">Check Status</button>
        <button onclick="runShaderTests()">Run Shader Tests</button>
        <button onclick="clearLogs()">Clear Logs</button>
        <div id="status-results"></div>
    </div>

    <div class="test-panel">
        <h2>Live System Logs</h2>
        <div id="log-output" class="log-output"></div>
    </div>

    <script>
        let originalLog = console.log;
        let originalWarn = console.warn;
        let originalError = console.error;
        let logOutput = null;
        
        function setupLogging() {
            logOutput = document.getElementById('log-output');
            
            console.log = function(...args) {
                if (logOutput) {
                    logOutput.textContent += `[${new Date().toLocaleTimeString()}] LOG: ${args.join(' ')}\n`;
                    logOutput.scrollTop = logOutput.scrollHeight;
                }
                originalLog.apply(console, args);
            };
            
            console.warn = function(...args) {
                if (logOutput) {
                    logOutput.textContent += `[${new Date().toLocaleTimeString()}] WARN: ${args.join(' ')}\n`;
                    logOutput.scrollTop = logOutput.scrollHeight;
                }
                originalWarn.apply(console, args);
            };
            
            console.error = function(...args) {
                if (logOutput) {
                    logOutput.textContent += `[${new Date().toLocaleTimeString()}] ERROR: ${args.join(' ')}\n`;
                    logOutput.scrollTop = logOutput.scrollHeight;
                }
                originalError.apply(console, args);
            };
        }
        
        function clearLogs() {
            if (logOutput) {
                logOutput.textContent = '';
            }
        }
        
        function checkSystemStatus() {
            console.log('🔍 Checking Grid OS system status...');
            const results = document.getElementById('status-results');
            
            const checks = [
                {
                    name: 'Grid OS Available',
                    test: () => typeof window.gridOS !== 'undefined',
                    description: 'Grid OS object exists on window'
                },
                {
                    name: 'System Health Method',
                    test: () => window.gridOS && typeof window.gridOS.getSystemHealth === 'function',
                    description: 'getSystemHealth method available'
                },
                {
                    name: 'Shader System Methods',
                    test: () => {
                        return window.gridOS && 
                               typeof window.gridOS.initializeShaderSystem === 'function' &&
                               typeof window.gridOS.isShaderSystemReady === 'function' &&
                               typeof window.gridOS.getShaderSystem === 'function';
                    },
                    description: 'All shader system methods available'
                },
                {
                    name: 'System Health Status',
                    test: () => {
                        if (!window.gridOS || typeof window.gridOS.getSystemHealth !== 'function') {
                            return { status: 'unavailable', details: 'Method not available' };
                        }
                        try {
                            const health = window.gridOS.getSystemHealth();
                            return { 
                                status: health.status, 
                                details: `Status: ${health.status}, Subsystems: ${Object.keys(health.subsystems || {}).length}` 
                            };
                        } catch (e) {
                            return { status: 'error', details: e.message };
                        }
                    },
                    description: 'System health check'
                },
                {
                    name: 'Shader System Ready',
                    test: () => {
                        if (!window.gridOS || typeof window.gridOS.isShaderSystemReady !== 'function') {
                            return { status: 'unavailable', details: 'Method not available' };
                        }
                        try {
                            const ready = window.gridOS.isShaderSystemReady();
                            return { 
                                status: ready ? 'ready' : 'pending', 
                                details: ready ? 'Shader system is ready' : 'Shader system pending initialization' 
                            };
                        } catch (e) {
                            return { status: 'error', details: e.message };
                        }
                    },
                    description: 'Shader system readiness check'
                }
            ];
            
            let html = '<h3>System Status Results:</h3>';
            
            checks.forEach(check => {
                let result = check.test();
                let status, statusClass, details;
                
                if (typeof result === 'boolean') {
                    status = result ? 'PASS' : 'FAIL';
                    statusClass = result ? 'result-pass' : 'result-fail';
                    details = check.description;
                } else if (typeof result === 'object') {
                    status = result.status.toUpperCase();
                    statusClass = result.status === 'ready' || result.status === 'healthy' ? 'result-pass' :
                                 result.status === 'pending' || result.status === 'initializing' ? 'result-pending' :
                                 'result-fail';
                    details = result.details;
                } else {
                    status = 'UNKNOWN';
                    statusClass = 'result-fail';
                    details = 'Unexpected result';
                }
                
                html += `<div class="result-item ${statusClass}">
                    <strong>${check.name}:</strong> ${status} - ${details}
                </div>`;
                
                console.log(`${check.name}: ${status} - ${details}`);
            });
            
            results.innerHTML = html;
        }
        
        function runShaderTests() {
            console.log('🎨 Running comprehensive shader system tests...');
            
            // Test 1: Check if we can get system health
            if (window.gridOS && typeof window.gridOS.getSystemHealth === 'function') {
                try {
                    const health = window.gridOS.getSystemHealth();
                    console.log('System Health Result:', health);
                } catch (e) {
                    console.error('Error getting system health:', e);
                }
            }
            
            // Test 2: Check shader system readiness
            if (window.gridOS && typeof window.gridOS.isShaderSystemReady === 'function') {
                try {
                    const ready = window.gridOS.isShaderSystemReady();
                    console.log('Shader System Ready:', ready);
                } catch (e) {
                    console.error('Error checking shader readiness:', e);
                }
            }
            
            // Test 3: Try to get shader system
            if (window.gridOS && typeof window.gridOS.getShaderSystem === 'function') {
                try {
                    const shaderSystem = window.gridOS.getShaderSystem();
                    console.log('Shader System Object:', shaderSystem);
                    
                    if (shaderSystem && typeof shaderSystem.isReady === 'function') {
                        console.log('Shader System isReady():', shaderSystem.isReady());
                    }
                    
                    if (shaderSystem && typeof shaderSystem.getDimensions === 'function') {
                        console.log('Shader System Dimensions:', shaderSystem.getDimensions());
                    }
                } catch (e) {
                    console.error('Error getting shader system:', e);
                }
            }
            
            console.log('✅ Shader tests completed');
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            setupLogging();
            console.log('🔧 Shader System Test Page Loaded');
            
            // Auto-check status after a moment
            setTimeout(() => {
                checkSystemStatus();
            }, 2000);
        });
    </script>
</body>
</html>
