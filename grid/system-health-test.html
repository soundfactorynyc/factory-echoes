<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid OS System Health Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            margin: 0;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .panel {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
        }
        .status-healthy { color: #00ff00; }
        .status-initializing { color: #00aaff; }
        .status-degraded { color: #ffaa00; }
        .status-critical { color: #ff0000; }
        .console-output {
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-size: 12px;
            white-space: pre-wrap;
            margin: 10px 0;
        }
        button {
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
            border-radius: 4px;
            font-family: inherit;
        }
        button:hover { background: #555; }
        .test-result {
            padding: 10px;
            margin: 5px 0;
            border-left: 4px solid;
            background: rgba(0, 0, 0, 0.3);
        }
        .result-pass { border-left-color: #00ff00; }
        .result-fail { border-left-color: #ff0000; }
        .result-pending { border-left-color: #00aaff; }
        .grid-iframe {
            width: 100%;
            height: 400px;
            border: 1px solid #333;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 Grid OS System Health Test</h1>
        <p>Testing if window.gridOS.getSystemHealth() returns proper status instead of always "degraded"</p>
        
        <div class="panel">
            <h2>Grid OS Integration Test</h2>
            <iframe id="gridFrame" class="grid-iframe" src="http://localhost:3002/"></iframe>
        </div>
        
        <div class="panel">
            <h2>System Health Commands</h2>
            <button onclick="testSystemHealth()">Test getSystemHealth()</button>
            <button onclick="testShaderSystem()">Test Shader System</button>
            <button onclick="testFullSystem()">Full System Test</button>
            <button onclick="runBrowserConsoleCommands()">Run Browser Console Commands</button>
            <button onclick="clearConsole()">Clear Console</button>
        </div>
        
        <div class="panel">
            <h2>Test Results</h2>
            <div id="test-results"></div>
        </div>
        
        <div class="panel">
            <h2>Console Output</h2>
            <div id="console-output" class="console-output"></div>
        </div>
    </div>

    <script>
        let consoleOutput = null;
        let originalLog = console.log;
        let originalWarn = console.warn;
        let originalError = console.error;
        
        function setupConsoleCapture() {
            consoleOutput = document.getElementById('console-output');
            
            function logToOutput(level, args) {
                if (consoleOutput) {
                    const timestamp = new Date().toLocaleTimeString();
                    consoleOutput.textContent += `[${timestamp}] ${level}: ${args.join(' ')}\n`;
                    consoleOutput.scrollTop = consoleOutput.scrollHeight;
                }
            }
            
            console.log = function(...args) {
                logToOutput('LOG', args);
                originalLog.apply(console, args);
            };
            
            console.warn = function(...args) {
                logToOutput('WARN', args);
                originalWarn.apply(console, args);
            };
            
            console.error = function(...args) {
                logToOutput('ERROR', args);
                originalError.apply(console, args);
            };
        }
        
        function clearConsole() {
            if (consoleOutput) {
                consoleOutput.textContent = '';
            }
        }
        
        function testSystemHealth() {
            console.log('🔍 Testing Grid OS System Health...');
            const resultsDiv = document.getElementById('test-results');
            
            // Try to access Grid OS from the iframe
            const iframe = document.getElementById('gridFrame');
            
            try {
                // Test direct access to Grid OS (if available)
                if (typeof window.gridOS !== 'undefined') {
                    console.log('✅ Grid OS found in current window');
                    const health = window.gridOS.getSystemHealth();
                    console.log('Current window health:', health);
                    
                    displayHealthResult(health, 'Current Window');
                } else {
                    console.log('⚠️ Grid OS not found in current window');
                }
                
                // Try to access Grid OS from iframe
                setTimeout(() => {
                    try {
                        const iframeWindow = iframe.contentWindow;
                        if (iframeWindow && iframeWindow.gridOS) {
                            console.log('✅ Grid OS found in iframe');
                            const health = iframeWindow.gridOS.getSystemHealth();
                            console.log('Iframe health:', health);
                            
                            displayHealthResult(health, 'Iframe Grid OS');
                            
                            // Run additional tests on the iframe Grid OS
                            testIframeGridOS(iframeWindow.gridOS);
                        } else {
                            console.log('⚠️ Grid OS not yet available in iframe, retrying...');
                            setTimeout(() => testSystemHealth(), 2000);
                        }
                    } catch (e) {
                        console.error('Error accessing iframe Grid OS:', e);
                    }
                }, 3000);
                
            } catch (error) {
                console.error('Error testing system health:', error);
                resultsDiv.innerHTML += `<div class="test-result result-fail">
                    <strong>System Health Test:</strong> ERROR - ${error.message}
                </div>`;
            }
        }
        
        function displayHealthResult(health, source) {
            const resultsDiv = document.getElementById('test-results');
            
            let statusClass = 'result-fail';
            if (health.status === 'healthy') {
                statusClass = 'result-pass';
            } else if (health.status === 'initializing' || health.status === 'pending') {
                statusClass = 'result-pending';
            }
            
            const subsystemsHtml = health.subsystems ? 
                Object.entries(health.subsystems).map(([name, subsystem]) => {
                    const subClass = subsystem.status === 'healthy' ? 'status-healthy' :
                                   subsystem.status === 'pending' || subsystem.status === 'initializing' ? 'status-initializing' :
                                   subsystem.status === 'degraded' ? 'status-degraded' : 'status-critical';
                    return `<div class="${subClass}">  ${name}: ${subsystem.status}</div>`;
                }).join('') : 'No subsystems info';
            
            resultsDiv.innerHTML += `<div class="test-result ${statusClass}">
                <strong>${source} System Health:</strong> ${health.status.toUpperCase()}<br>
                <strong>Subsystems:</strong><br>
                ${subsystemsHtml}
                <br><strong>Diagnostics:</strong> ${health.diagnostics ? health.diagnostics.join(', ') : 'None'}
            </div>`;
        }
        
        function testIframeGridOS(gridOS) {
            console.log('🧪 Running comprehensive Grid OS tests...');
            const resultsDiv = document.getElementById('test-results');
            
            const tests = [
                {
                    name: 'Shader System Ready Check',
                    test: () => {
                        if (typeof gridOS.isShaderSystemReady === 'function') {
                            return gridOS.isShaderSystemReady();
                        }
                        return false;
                    }
                },
                {
                    name: 'Shader System Object',
                    test: () => {
                        if (typeof gridOS.getShaderSystem === 'function') {
                            const shaderSystem = gridOS.getShaderSystem();
                            return shaderSystem !== null;
                        }
                        return false;
                    }
                },
                {
                    name: 'Event Bus Available',
                    test: () => {
                        return gridOS.eventBus !== undefined;
                    }
                },
                {
                    name: 'Trigger System Available',
                    test: () => {
                        return gridOS.triggerSystem !== undefined;
                    }
                }
            ];
            
            tests.forEach(test => {
                try {
                    const result = test.test();
                    const resultClass = result ? 'result-pass' : 'result-fail';
                    const resultText = result ? 'PASS' : 'FAIL';
                    
                    resultsDiv.innerHTML += `<div class="test-result ${resultClass}">
                        <strong>${test.name}:</strong> ${resultText}
                    </div>`;
                    
                    console.log(`${test.name}: ${resultText}`);
                } catch (error) {
                    resultsDiv.innerHTML += `<div class="test-result result-fail">
                        <strong>${test.name}:</strong> ERROR - ${error.message}
                    </div>`;
                    console.error(`${test.name}: ERROR -`, error);
                }
            });
        }
        
        function testShaderSystem() {
            console.log('🎨 Testing Shader System specifically...');
            
            const iframe = document.getElementById('gridFrame');
            setTimeout(() => {
                try {
                    const iframeWindow = iframe.contentWindow;
                    if (iframeWindow && iframeWindow.gridOS) {
                        const gridOS = iframeWindow.gridOS;
                        
                        if (typeof gridOS.getShaderSystem === 'function') {
                            const shaderSystem = gridOS.getShaderSystem();
                            console.log('Shader System Details:', {
                                exists: !!shaderSystem,
                                isReady: shaderSystem && typeof shaderSystem.isReady === 'function' ? shaderSystem.isReady() : 'method not available',
                                dimensions: shaderSystem && typeof shaderSystem.getDimensions === 'function' ? shaderSystem.getDimensions() : 'method not available'
                            });
                        }
                        
                        if (typeof gridOS.isShaderSystemReady === 'function') {
                            console.log('Shader System Ready Status:', gridOS.isShaderSystemReady());
                        }
                    }
                } catch (e) {
                    console.error('Error testing shader system:', e);
                }
            }, 3000);
        }
        
        function testFullSystem() {
            console.log('🚀 Running full system test...');
            clearConsole();
            setTimeout(() => {
                testSystemHealth();
                setTimeout(() => {
                    testShaderSystem();
                }, 1000);
            }, 1000);
        }
        
        function runBrowserConsoleCommands() {
            console.log('🖥️ Running browser console commands...');
            
            const iframe = document.getElementById('gridFrame');
            setTimeout(() => {
                try {
                    const iframeWindow = iframe.contentWindow;
                    if (iframeWindow && iframeWindow.gridOS) {
                        console.log('--- Browser Console Command Test ---');
                        
                        // Simulate the exact command the user would run in browser console
                        console.log('Running: window.gridOS.getSystemHealth()');
                        const health = iframeWindow.gridOS.getSystemHealth();
                        console.log('Result:', health);
                        
                        // Check if it's no longer always "degraded"
                        if (health.status === 'degraded') {
                            console.warn('⚠️ System still showing degraded status');
                        } else if (health.status === 'healthy') {
                            console.log('✅ System showing healthy status!');
                        } else if (health.status === 'initializing') {
                            console.log('🔄 System showing initializing status (this is good!)');
                        } else {
                            console.log(`ℹ️ System showing status: ${health.status}`);
                        }
                        
                        // Additional console commands
                        if (typeof iframeWindow.gridOS.isShaderSystemReady === 'function') {
                            console.log('Running: window.gridOS.isShaderSystemReady()');
                            console.log('Result:', iframeWindow.gridOS.isShaderSystemReady());
                        }
                        
                        if (typeof iframeWindow.gridSystemTest !== 'undefined') {
                            console.log('Running: window.gridSystemTest.runAllTests()');
                            const testResults = iframeWindow.gridSystemTest.runAllTests();
                            console.log('Test Results:', testResults);
                        }
                        
                    } else {
                        console.error('❌ Grid OS not available in iframe for console commands');
                    }
                } catch (e) {
                    console.error('Error running browser console commands:', e);
                }
            }, 4000);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setupConsoleCapture();
            console.log('🔧 Grid OS System Health Test initialized');
            
            // Auto-run tests after iframe loads
            setTimeout(() => {
                console.log('🚀 Auto-running initial system test...');
                testSystemHealth();
            }, 5000);
        });
    </script>
</body>
</html>
